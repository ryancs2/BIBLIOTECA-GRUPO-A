{% extends 'livros/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4">{% if livro %}Editar Livro{% else %}Cadastrar Novo Livro{% endif %}</h2>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control" value="{{ livro.titulo }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Autor</label>
                        <input type="text" name="autor" class="form-control" value="{{ livro.autor }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Editora</label>
                        <input type="text" name="editora" class="form-control" value="{{ livro.editora }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ano de Publicação</label>
                        <input type="number" name="ano_publicacao" class="form-control" value="{{ livro.ano_publicacao }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantidade de Exemplares</label>
                        <input type="number" name="quantidade_exemplares" class="form-control" value="{{ livro.quantidade_exemplares }}" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="disponivel" class="form-check-input" id="disponivel" {% if not livro or livro.disponivel %}checked{% endif %}>
                        <label class="form-check-label" for="disponivel">Disponível para empréstimo</label>
                    </div>
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <a href="{% url 'lista_livros' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
