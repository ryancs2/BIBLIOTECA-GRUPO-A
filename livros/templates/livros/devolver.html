{% extends 'livros/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">Confirmar Devolução</h3>
            <p>Confirma a devolução do livro <strong>"{{ emprestimo.livro.titulo }}"</strong>, retirado por {{ emprestimo.nome_completo }}?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-success">Confirmar Devolução</button>
                <a href="{% url 'historico_usuario' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
