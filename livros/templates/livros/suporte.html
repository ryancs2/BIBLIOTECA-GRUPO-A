{% extends 'livros/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h2 class="mb-3 text-primary">Central de Suporte</h2>
            <p class="text-muted">Encontrou algum erro no sistema ou tem dúvidas sobre empréstimos? Envie uma mensagem para nossa equipe.</p>
            
            {% if sucesso %}
                <div class="alert alert-success" role="alert">
                    Mensagem enviada com sucesso! Retornaremos em breve.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Seu Nome</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Relate o Erro ou Dúvida</label>
                    <textarea name="mensagem" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Enviar Mensagem</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
